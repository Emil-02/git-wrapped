name: 🐛 Bug report
description: Something looks wrong or broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the URL (e.g. /u/username) and screenshots if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone 15"
